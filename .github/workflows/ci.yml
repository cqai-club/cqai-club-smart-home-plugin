name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.34.5
          run_install: false
          cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test isolated simulated devices
        run: pnpm test
      - name: Build plugin
        run: pnpm build
      - name: Smoke test simulated DSH Host and client
        run: pnpm smoke:host .
      - name: Audit npm tarball and marketplace entry
        run: node scripts/verify-release.mjs
      - name: Save audited package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package-${{ github.sha }}
          path: |
            .release/*.tgz
            .release/package-audit.json
            .release/market-entry.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
