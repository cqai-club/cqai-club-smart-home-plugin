name: Release npm package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, for example v0.1.1
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'cqai-club/cqai-club-smart-home-plugin' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.34.5
          run_install: false
          cache: false
      - name: Install publishing CLI
        run: npm install --global npm@11.16.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, test and build
        run: pnpm check
      - name: Smoke test simulated DSH Host and client
        run: pnpm smoke:host .
      - name: Validate tag and audit package
        id: package
        run: node scripts/verify-release.mjs --tag "$RELEASE_TAG" --check-registry
      - name: Save audited release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: |
            .release/*.tgz
            .release/package-audit.json
            .release/market-entry.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish audited tarball to npm
        if: steps.package.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --provenance --ignore-scripts
      - name: Verify npm package integrity
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: node scripts/verify-release.mjs --verify-published "$TARBALL"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$TARBALL" .release/market-entry.json .release/package-audit.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$TARBALL" .release/market-entry.json .release/package-audit.json --verify-tag --generate-notes --title "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          fi
